name: Build Documenti APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Documenti-Android-source.zip
      - patches/**
      - .github/workflows/build-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36-ext19"'

      - name: Extract project
        run: unzip -q Documenti-Android-source.zip -d source

      - name: Apply Documenti 1.3.2 fixes
        run: |
          cp patches/InteractivePdfFragment.kt source/MedSlideAndroid/app/src/main/java/it/ale/medslide/ui/InteractivePdfFragment.kt
          cp patches/1.3.2/app-build.gradle.kts source/MedSlideAndroid/app/build.gradle.kts
          cp patches/1.3.2/themes.xml source/MedSlideAndroid/app/src/main/res/values/themes.xml
          cp patches/1.3.2/themes-night.xml source/MedSlideAndroid/app/src/main/res/values-night/themes.xml

      - name: Build and unit test APK
        working-directory: source/MedSlideAndroid
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp source/MedSlideAndroid/app/build/outputs/apk/debug/app-debug.apk Documenti-1.3.2-tablet.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Documenti-Android-1.3.2
          path: Documenti-1.3.2-tablet.apk
          if-no-files-found: error
          retention-days: 30

      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Verify PDF opening and restart on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd source/MedSlideAndroid && ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDF-regression-results-1.3.2
          path: source/MedSlideAndroid/app/build/reports/androidTests

      - name: Publish APK download
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.3.2 >/dev/null 2>&1; then
            gh release create v1.3.2 Documenti-1.3.2-tablet.apk --title "Documenti 1.3.2" --notes "Corretto il crash del visualizzatore PDF dovuto al tema Android. Include zoom, navigazione, selezione testo/link e protezione dal crash al riavvio."
          else
            gh release upload v1.3.2 Documenti-1.3.2-tablet.apk --clobber
          fi
