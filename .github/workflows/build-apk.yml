name: Build Documenti APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: unzip -q Documenti-Android-source.zip -d source

      - name: Build installable APK
        working-directory: source/MedSlideAndroid
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp source/MedSlideAndroid/app/build/outputs/apk/debug/app-debug.apk Documenti.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Documenti-Android
          path: Documenti.apk
          if-no-files-found: error
          retention-days: 30
