name: Build Documenti APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Documenti-Android-source.zip
      - .github/workflows/build-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36-ext19"'
      - name: Extract project
        run: unzip -q Documenti-Android-source.zip -d source
      - name: Build and test APK
        working-directory: source/MedSlideAndroid
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp source/MedSlideAndroid/app/build/outputs/apk/debug/app-debug.apk Documenti.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Documenti-Android-1.3.1
          path: Documenti.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify PDF opening and restart on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd source/MedSlideAndroid && ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDF-regression-results
          path: source/MedSlideAndroid/app/build/reports/androidTests
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.3.1 >/dev/null 2>&1; then
            gh release create v1.3.1 Documenti.apk --title "Documenti 1.3.1" --notes "Corretto il crash all’apertura dei PDF e al riavvio. Test apertura e navigazione su emulatore Android."
          fi
