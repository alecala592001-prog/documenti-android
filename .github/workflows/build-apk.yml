name: Build Documenti APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Documenti-Android-source.zip

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36-ext19"
      - name: Extract project
        run: unzip -q Documenti-Android-source.zip -d source
      - name: Build and test APK
        working-directory: source/MedSlideAndroid
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp source/MedSlideAndroid/app/build/outputs/apk/debug/app-debug.apk Documenti.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Documenti-Android-1.3
          path: Documenti.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.3.0 >/dev/null 2>&1; then
            gh release create v1.3.0 Documenti.apk --title "Documenti 1.3.0" --notes "Zoom PDF, selezione e copia testo, link apribili e cartelle a colori."
          fi
